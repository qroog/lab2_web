<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">Прогноз погоды</h1>
            <button class="header__refresh" id="refreshBtn">
                <i class="wi wi-refresh"></i>
            </button>
        </header>

        <div class="add-city">
            <input type="text" class="add-city__input" id="cityInput" placeholder="Добавить город...">
            <div class="add-city__dropdown" id="cityDropdown"></div>
            <div class="add-city__error" id="cityError"></div>
        </div>

        <div class="tabs" id="cityTabs"></div>
        <div class="weather-content" id="weatherContent"></div>
    </div>

    <div class="modal" id="geoModal">
        <div class="modal__content">
            <h2 class="modal__title">Доступ к геолокации</h2>
            <p class="modal__text">
                Разрешите доступ к геолокации для автоматического определения вашего местоположения
            </p>
            <div class="modal__buttons">
                <button class="modal__btn modal__btn--primary" id="allowGeoBtn">Разрешить</button>
                <button class="modal__btn modal__btn--secondary" id="denyGeoBtn">Отклонить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="manualCityModal">
        <div class="modal__content">
            <h2 class="modal__title">Выберите город</h2>
            <p class="modal__text">Выберите город для получения прогноза погоды</p>
            <input
                type="text"
                class="modal__input"
                id="manualCityInput"
                placeholder="Введите название города..."
            >
            <div class="modal__dropdown" id="manualCityDropdown"></div>
            <div class="add-city__error" id="manualCityError"></div>
            <div class="modal__buttons">
                <button class="modal__btn modal__btn--primary" id="confirmManualCity">Подтвердить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
